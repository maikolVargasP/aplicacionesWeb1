<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MEMORAMA</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
       <div class="contenedor">
        <header>
            <h1>MEMORAMA</h1>
            <p class="subtitulo">Encuentra todas las parejas de cartas</p>
        </header>
        
        <div class="juego-contenido">
            <div class="panel-izquierdo"> <!-- Panel izquierdo: controles e información -->
                <div class="seccion">
                    <!-- Selección de dificultad -->
                    <h2><i class="fas fa-sliders-h"></i> Nivel de Dificultad</h2>
                    <div class="dificultad-opciones">
                        <button class="dificultad-btn facil activo">
                            <i class="fas fa-leaf"></i> Fácil
                        </button>
                        <button class="dificultad-btn medio">
                            <i class="fas fa-balance-scale"></i> Medio
                        </button>
                        <button class="dificultad-btn dificil">
                            <i class="fas fa-fire"></i> Difícil
                        </button>
                    </div>
                </div>
                <!-- Intentos realizados -->
                <div class="seccion">
                    <h2><i class="fas fa-redo"></i> Intentos</h2>
                    <div class="intentos">0</div>
                </div>
                <!-- Botón para reiniciar -->
                <div class="seccion">
                    <button class="reiniciar-btn">
                        <i class="fas fa-sync-alt"></i> Reiniciar Juego
                    </button>
                </div>

                <!-- Sección de mejores puntuaciones -->
                <div class="seccion puntuaciones">
                    <h2><i class="fas fa-trophy"></i> Mejores Puntuaciones</h2>
                    <div class="puntuaciones-contenido">
                        <table class="puntuaciones-tabla">
                            <thead>
                                <tr>
                                    <th>Dificultad</th>
                                    <th>Intentos</th>
                                    <th>Tiempo</th>
                                </tr>
                            </thead>
                            <tbody id="puntuaciones-body">
                                <!-- Las puntuaciones se cargarán aquí con JavaScript -->
                            </tbody>
                        </table>
                        <div class="sin-puntuaciones" id="sin-puntuaciones">
                            No hay puntuaciones guardadas
                        </div>
                    </div>
                    <!-- Botón para limpiar puntuaciones -->
                    <div class="botones-puntuaciones">
                        <button class="boton-puntuacion boton-limpiar" id="limpiar-puntuaciones">
                            <i class="fas fa-trash"></i> Limpiar
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="panel-derecho"> <!-- Panel derecho: tablero y tiempo -->
                <div class="seccion">
                    <h2><i class="fas fa-clock"></i> Tiempo</h2>
                    <div class="tiempo">00:00</div>
                </div>
                <div class="tablero">
                    <!-- Cartas generadas por JavaScript -->
                </div>
                <div class="mensaje-ganador">
                    ¡Felicidades! Has completado el juego.
                    <div id="mensaje-record"></div>
                    <button class="boton-puntuacion boton-guardar" id="guardar-puntuacion">
                        <i class="fas fa-save"></i> Guardar Puntuación
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/index.js"></script>
</body>
</html>
